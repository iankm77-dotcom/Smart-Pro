<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTradePro Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 15px;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>SmartTradePro</h2>
    <p id="status">Completing Deriv login...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const error = params.get("error");

    if (error) {
      document.getElementById("status").textContent =
        "Deriv login was cancelled or failed: " + error;
    } 
    else if (code) {
      document.getElementById("status").textContent =
        "Deriv authorization received. Returning to SmartTradePro...";

      sessionStorage.setItem("deriv_auth_code", code);

      setTimeout(() => {
        window.location.href = "/";
      }, 1500);
    } 
    else {
      document.getElementById("status").textContent =
        "No authorization response was received.";
    }
  </script>

</body>
</html>
