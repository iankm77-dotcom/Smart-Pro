<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pro Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Smart Pro</h2>
    <p id="status">Completing Deriv login...</p>
  </div>

  <script>

    async function completeLogin() {

      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const error = params.get("error");
      const state = params.get("state");

      const savedState =
        sessionStorage.getItem("deriv_oauth_state");

      const codeVerifier =
        sessionStorage.getItem("deriv_code_verifier");

      if (error) {

        document.getElementById("status").textContent =
          "Deriv login failed: " + error;

        return;
      }

      if (!code) {

        document.getElementById("status").textContent =
          "No authorization code was received.";

        return;
      }

      if (!state || state !== savedState) {

        document.getElementById("status").textContent =
          "Security check failed: invalid state.";

        return;
      }

      if (!codeVerifier) {

        document.getElementById("status").textContent =
          "PKCE code verifier is missing.";

        return;
      }

      document.getElementById("status").textContent =
        "Authorization received. Connecting to Deriv...";

      try {

        const response = await fetch(
          "https://auth.deriv.com/oauth2/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "grant_type=authorization_code" +
              "&code=" + encodeURIComponent(code) +
              "&client_id=" +
              encodeURIComponent("34d8l4gpZvYeLnHZVacCy") +
              "&redirect_uri=" +
              encodeURIComponent(
                "https://derivpro.top/oauth/callback.html"
              ) +
              "&code_verifier=" +
              encodeURIComponent(codeVerifier)
          }
        );

        const data = await response.json();

        if (!response.ok) {

          throw new Error(
            data.error_description ||
            data.error ||
            "Token exchange failed"
          );
        }

        sessionStorage.setItem(
          "deriv_access_token",
          data.access_token
        );

        sessionStorage.removeItem(
          "deriv_oauth_state"
        );

        sessionStorage.removeItem(
          "deriv_code_verifier"
        );

        document.getElementById("status").textContent =
          "Deriv login successful. Returning to Smart Pro...";

        setTimeout(() => {

          window.location.href = "/";

        }, 1000);

      } catch (error) {

        document.getElementById("status").textContent =
          "Deriv login failed: " + error.message;
      }
    }

    completeLogin();

  </script>

</body>
</html>
